name: Fresh Jobs (fast tier)

# Hourly top-up scrape of ONLY the companies that recently posted roles matching
# data/role_filter.json. The shortlist is a few thousand companies instead of
# ~60k, so a run takes minutes -- which is what makes "new within the hour"
# possible without re-scraping everything.
#
# merge_data.py overlays results onto existing data and never prunes anything the
# scrape didn't cover, so a partial scrape is safe to merge.

on:
  schedule:
    - cron: "17 * * * *" # hourly, offset off the hour to avoid Actions peak queueing
  workflow_dispatch:

permissions:
  contents: read

# Shared with the daily full scrape so the two never force-push the data repo
# at the same time. The daily run is the more important one, so it wins.
concurrency:
  group: job-data-pipeline
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50 # must stay under the 1h cron interval
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch existing data from data repo
        run: |
          git clone --depth 1 https://github.com/${{ github.repository_owner }}/job-board-data.git prev-data
          mkdir -p data/chunks
          cp -r prev-data/data/chunks/* data/chunks/ 2>/dev/null || true
          cp prev-data/data/metadata.json data/metadata.json 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check shortlist exists
        id: shortlist
        run: |
          if [ -f data/role_shortlist.json ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No data/role_shortlist.json yet - run the daily scrape once to generate it."
          fi

      - name: Scrape shortlist companies
        if: steps.shortlist.outputs.found == 'true'
        run: |
          cd scripts
          python scraper.py --source automated --shortlist ../data/role_shortlist.json

      - name: Merge into existing data
        if: steps.shortlist.outputs.found == 'true'
        run: python scripts/merge_data.py

      - name: Report new jobs
        if: steps.shortlist.outputs.found == 'true'
        run: |
          NEW=$(jq -r '.new_jobs // 0' data/metadata.json)
          TOTAL=$(jq -r '.total_jobs' data/metadata.json)
          echo "### Fresh scrape: $NEW new jobs (dataset now $TOTAL)" >> $GITHUB_STEP_SUMMARY

      - name: Push regenerated data to data repo
        if: steps.shortlist.outputs.found == 'true'
        run: |
          git clone https://x-access-token:${DATA_REPO_TOKEN}@github.com/${{ github.repository_owner }}/job-board-data.git data-repo
          cd data-repo
          git checkout --orphan fresh
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p data/chunks .github
          cp -r ../.github/data-repo-workflows .github/workflows
          cp -r ../data/chunks/* data/chunks/
          cp ../data/metadata.json data/metadata.json
          cp ../data/README.md README.md
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Fresh snapshot $(date +'%Y-%m-%d %H:%M UTC')"
          git branch -D main 2>/dev/null || true
          git branch -m main
          git push -f origin main
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
