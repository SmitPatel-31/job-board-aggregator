name: Fresh Jobs (fast tier)

# Top-up scrape of only the companies that recently posted roles matching
# data/role_filter.json, then publish the site + data to GitHub Pages.
#
# The shortlist is a few thousand companies instead of ~60k. Runner IPs also
# rotate across a large shared pool, so Ashby's rate limiting costs far less
# here than it does from a single fixed address.
#
# merge_data.py overlays results onto existing data and never prunes anything
# the scrape didn't cover, so a partial scrape is safe to merge.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6h at :17, offset off the hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the daily full scrape so the two never publish at once.
concurrency:
  group: job-data-pipeline
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Surfaced so the deploy job can tell "nothing to publish" apart from
    # "publish failed" instead of erroring on a missing artifact.
    outputs:
      published: ${{ steps.shortlist.outputs.found }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The previous dataset lives in the last Pages deployment, so pull the
      # chunks straight off the live site. No second repo, no token.
      - name: Fetch existing data from the live site
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p data/chunks
          if curl -fsS "$SITE/data/chunks/jobs_manifest.json" -o data/chunks/jobs_manifest.json; then
            jq -r '.chunks[]' data/chunks/jobs_manifest.json | while read -r c; do
              curl -fsS "$SITE/data/chunks/$c" -o "data/chunks/$c"
            done
            curl -fsS "$SITE/data/metadata.json" -o data/metadata.json || true
            echo "Restored $(jq -r '.totalJobs' data/chunks/jobs_manifest.json) jobs from the live site."
          else
            echo "::warning::No dataset published yet; starting from this scrape alone."
            rm -f data/chunks/jobs_manifest.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check shortlist exists
        id: shortlist
        run: |
          if [ -f data/role_shortlist.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No data/role_shortlist.json. Run the full scrape once to generate it."
          fi

      - name: Scrape shortlist companies
        if: steps.shortlist.outputs.found == 'true'
        run: |
          cd scripts
          python scraper.py --source automated --shortlist ../data/role_shortlist.json

      - name: Merge into existing data
        if: steps.shortlist.outputs.found == 'true'
        run: python scripts/merge_data.py

      - name: Report new jobs
        if: steps.shortlist.outputs.found == 'true'
        run: |
          NEW=$(jq -r '.new_jobs // 0' data/metadata.json)
          TOTAL=$(jq -r '.total_jobs' data/metadata.json)
          echo "### Fresh scrape: $NEW new jobs (dataset now $TOTAL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble the Pages bundle
        if: steps.shortlist.outputs.found == 'true'
        run: bash .github/scripts/build-site.sh

      - name: Upload Pages artifact
        if: steps.shortlist.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: fresh
    if: needs.fresh.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
