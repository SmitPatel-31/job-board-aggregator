name: Test Job URL's
on:
  # Disabled: burns private-repo Actions minutes and hits live ATS endpoints.
  # Run it by hand when you want a health check.
  #
  # schedule:
  #   - cron: "00 1 * * *"
  workflow_dispatch: # Manual trigger button
jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Job Tester
        run: |
          python -m scripts.tests.test_suite.test_url