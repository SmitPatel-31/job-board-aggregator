name: Update Job Listings
on:
  # Cron is disabled on purpose. This repo is private, where GitHub Actions is
  # capped at 2,000 minutes/month, and a single full scrape runs for hours --
  # the schedule would exhaust the quota within days. Scheduling lives on the
  # self-hosted box instead (see deploy/README.md systemd timers).
  # Re-enable by uncommenting, ideally only if the repo is public.
  #
  # schedule:
  #   - cron: "33 7 * * *"
  workflow_dispatch: # Manual trigger button

permissions:
  contents: write # commit the trend snapshot + shortlist, create releases
  issues: write # open an issue on anomaly

# Shared with the hourly fast tier so the two never force-push the data repo at
# the same time.
concurrency:
  group: job-data-pipeline
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max to prevent hanging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Pull yesterday's chunk data from the job-board-data repo into the working
      # tree so merge_data.py can read existing jobs and merge into them.
      # Without this, load_chunks("data") finds nothing and the merge discards
      # all accumulated history, collapsing the dataset.

      - name: Fetch existing data from data repo
        run: |
          # A missing data repo is the normal first-run state, so don't let a
          # failed clone kill the job with exit 128. Without previous data the
          # merge simply starts from this scrape.
          #
          # GIT_TERMINAL_PROMPT=0 matters: for a repo that is absent *or*
          # private, git answers the 404 by asking for a username. With no tty
          # that surfaces as "could not read Username ... No such device or
          # address", and on some runners it blocks instead of failing. This
          # makes git give up immediately so the branch below is reached.
          export GIT_TERMINAL_PROMPT=0
          mkdir -p data/chunks
          if git clone --depth 1 \
               "https://github.com/${{ github.repository_owner }}/job-board-data.git" prev-data 2>/dev/null; then
            cp -r prev-data/data/chunks/* data/chunks/ 2>/dev/null || true
            cp prev-data/data/metadata.json data/metadata.json 2>/dev/null || true
            echo "Loaded previous dataset from the data repo."
          else
            echo "::warning::No job-board-data repo found for ${{ github.repository_owner }}."
            echo "Starting from an empty dataset; nothing accumulated will be lost yet."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job scraper
        run: |
          cd scripts
          python scraper.py --source automated

      - name: Merge with existing data
        run: python scripts/merge_data.py

      # Refresh the hourly fast tier's target list from this full scrape, so it
      # tracks companies that are actually posting matching roles.
      - name: Build role shortlist for fast tier
        run: python scripts/build_shortlist.py

      - name: Save trend snapshot
        run: |
          mkdir -p data/trends
          DATE=$(date +'%Y-%m-%d')

          # Per-platform breakdown from the scraper output
          GREENHOUSE=$(jq '[.[] | select(.ats == "Greenhouse")] | length' scripts/output/all_jobs.json)
          ASHBY=$(jq '[.[] | select(.ats == "Ashby")] | length' scripts/output/all_jobs.json)
          BAMBOOHR=$(jq '[.[] | select(.ats == "BambooHR")] | length' scripts/output/all_jobs.json)
          LEVER=$(jq '[.[] | select(.ats == "Lever")] | length' scripts/output/all_jobs.json)
          WORKDAY=$(jq '[.[] | select(.ats == "Workday")] | length' scripts/output/all_jobs.json)
          ICIMS=$(jq '[.[] | select(.ats == "iCIMS")] | length' scripts/output/all_jobs.json)
          PAYLOCITY=$(jq '[.[] | select(.ats == "Paylocity")] | length' scripts/output/all_jobs.json)

          # Tier breakdown
          INTERN=$(jq '[.[] | select(.skill_level == "intern")] | length' scripts/output/all_jobs.json)
          ENTRY=$(jq '[.[] | select(.skill_level == "entry")] | length' scripts/output/all_jobs.json)
          MID=$(jq '[.[] | select(.skill_level == "mid")] | length' scripts/output/all_jobs.json)
          SENIOR=$(jq '[.[] | select(.skill_level == "senior")] | length' scripts/output/all_jobs.json)

          # Active companies count
          COMPANIES=$(jq '. | length' scripts/output/active_companies.json)
          RECRUITER=$(jq -r '.recruiter_jobs' scripts/output/metadata.json)

          # -c forces compact single-line output so daily.jsonl stays valid JSONL
          jq -nc \
            --arg date "$DATE" \
            --argjson total_jobs "$(jq -r '.total_jobs' data/metadata.json)" \
            --argjson active_companies "$COMPANIES" \
            --argjson recruiter_jobs "$RECRUITER" \
            --argjson greenhouse "$GREENHOUSE" \
            --argjson ashby "$ASHBY" \
            --argjson bamboohr "$BAMBOOHR" \
            --argjson lever "$LEVER" \
            --argjson workday "$WORKDAY" \
            --argjson icims "$ICIMS" \
            --argjson paylocity "$PAYLOCITY" \
            --argjson intern "$INTERN" \
            --argjson entry "$ENTRY" \
            --argjson mid "$MID" \
            --argjson senior "$SENIOR" \
            '{
              date: $date,
              total_jobs: $total_jobs,
              active_companies: $active_companies,
              recruiter_jobs: $recruiter_jobs,
              by_platform: {
                greenhouse: $greenhouse,
                ashby: $ashby,
                bamboohr: $bamboohr,
                lever: $lever,
                workday: $workday,
                icims: $icims,
                paylocity: $paylocity
              },
              by_tier: {
                intern: $intern,
                entry: $entry,
                mid: $mid,
                senior: $senior
              }
            }' >> data/trends/daily.jsonl
      - name: Get job count and timestamp
        id: metadata
        run: |
          JOBS=$(jq -r '.total_jobs' data/metadata.json)
          COMPANIES=$(jq '. | length' scripts/output/active_companies.json)
          DATE=$(date +'%Y-%m-%d %H:%M UTC')
          echo "jobs=$JOBS" >> $GITHUB_OUTPUT
          echo "companies=$COMPANIES" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "tag=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Compress release files
        run: gzip -k scripts/output/all_jobs.json

      - name: Clean old releases (keep last 10)
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName -q '.[10:] | .[].tagName')
          if [ -n "$RELEASES" ]; then
            echo "$RELEASES" | while read tag; do
              echo "Deleting release: $tag"
              gh release delete "$tag" --cleanup-tag -y
            done
          else
            echo "No old releases to clean up"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with job data
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jobs-${{ steps.metadata.outputs.tag }}
          name: Jobs Update - ${{ steps.metadata.outputs.date }}
          body: |
            ## Job Board Update (Automated)
            **Total Jobs:** ${{ steps.metadata.outputs.jobs }}  
            **Active Companies:** ${{ steps.metadata.outputs.companies }}  
            **Last Updated:** ${{ steps.metadata.outputs.date }}
            The chunked job data is served from the `job-board-data` repo via GitHub Pages.
          files: |
            scripts/output/all_jobs.json.gz
            scripts/output/active_companies.json
            scripts/output/metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trend history is append-only and tiny; it stays tracked on main.
      # The role shortlist rides along so the hourly fast tier picks it up.
      - name: Commit trend history to main
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/trends/daily.jsonl data/role_shortlist.json
          git diff --staged --quiet || git commit -m "Trend snapshot $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Check for platform anomalies
        id: anomaly
        continue-on-error: true
        run: python scripts/check_anomalies.py

      - name: Open issue on anomaly
        if: steps.anomaly.outputs.anomaly == 'true'
        run: |
          gh issue create \
            --title "Scraper anomaly $(date +'%Y-%m-%d')" \
            --body "$ANOMALY_REPORT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env rather than inlined into the script, so the report text
          # can never be parsed as shell.
          ANOMALY_REPORT: ${{ steps.anomaly.outputs.report }}
      - name: Push regenerated data to data repo
        if: env.DATA_REPO_TOKEN != ''
        run: |
          git clone https://x-access-token:${DATA_REPO_TOKEN}@github.com/${{ github.repository_owner }}/job-board-data.git data-repo
          cd data-repo
          git checkout --orphan fresh
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p data/chunks .github
          cp -r ../.github/data-repo-workflows .github/workflows
          cp -r ../data/chunks/* data/chunks/
          cp ../data/metadata.json data/metadata.json
          cp ../data/README.md README.md
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Data snapshot $(date +'%Y-%m-%d %H:%M UTC')"
          git branch -D main 2>/dev/null || true
          git branch -m main
          git push -f origin main
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
