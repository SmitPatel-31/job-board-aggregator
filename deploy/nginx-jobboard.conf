# nginx site for the job board.
#
# Install HTTP-only first, then run certbot --nginx, which injects the TLS
# server block and the HTTP->HTTPS redirect itself. Hand-writing ssl_certificate
# paths before the cert exists just stops nginx from starting.
#
#   sudo cp deploy/nginx-jobboard.conf /etc/nginx/sites-available/jobboard
#   sudo ln -s /etc/nginx/sites-available/jobboard /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d jobs.example.com
#
# Replace jobs.example.com throughout.

server {
    listen 80;
    listen [::]:80;
    server_name jobs.example.com;

    # Static app: the git checkout. Chunk data is NOT here -- see /data/chunks/.
    root /srv/jobboard/app;
    index index.html;

    access_log /var/log/nginx/jobboard.access.log;
    error_log  /var/log/nginx/jobboard.error.log;

    # ── Security headers ─────────────────────────────────────────────────────
    # NOTE ON NGINX INHERITANCE: a location block that declares its own
    # add_header discards every add_header inherited from the server block.
    # So caching below is set with `expires` (a different directive, which does
    # not reset inheritance) rather than add_header Cache-Control. Get this
    # wrong and the CSP silently vanishes from the HTML document.
    #
    # The app has no inline <script> blocks and no inline event handlers, so
    # script-src can omit 'unsafe-inline'. That matters: it blocks the stored
    # XSS path where a hostile job title injects <img onerror=...> through
    # innerHTML, because CSP treats an injected handler as inline script.
    #
    # style-src does need 'unsafe-inline' (markup and JS set style="...").
    # Style injection is far less dangerous than script execution.
    #
    # Update the CDN hosts if you change the vendored libraries. If you add
    # analytics, add its host to script-src and connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compress text assets. The chunk files are excluded below: already gzip.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Chunk data: the atomically published release ─────────────────────────
    # /srv/jobboard/current is a symlink that scripts/publish.py flips with
    # rename(2), so this always resolves to a complete dataset.

    # The manifest names the current chunk set, so it must never be cached.
    # This is the one place add_header is used in a location: it costs the
    # inherited CSP, which is fine because this response is JSON data consumed
    # by fetch(), not a document that can execute anything.
    location = /data/chunks/jobs_manifest.json {
        alias /srv/jobboard/current/chunks/jobs_manifest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location /data/chunks/ {
        alias /srv/jobboard/current/chunks/;

        # CRITICAL: do not serve these with Content-Encoding: gzip. The client
        # decompresses them itself via DecompressionStream('gzip') in
        # js/chunk_worker.js. If nginx advertised the encoding, the browser
        # would transparently gunzip first, and the JS would then fail trying
        # to gunzip plain JSON.
        #
        # gzip off is enough: ngx_http_gunzip_module is not enabled by default,
        # and naming `gunzip off` here would break startup on builds that lack
        # the module ("unknown directive").
        gzip off;
        default_type application/octet-stream;

        # Safe to cache hard: the frontend appends ?v=<manifest.last_updated>,
        # so a new dataset means a new URL.
        expires max;
    }

    # Role preset config: small, changes rarely, shouldn't go stale.
    location = /data/role_filter.json {
        expires 5m;
    }

    # status.html reads these two. metadata.json comes from the published
    # release (the merge writes it there), the trend log from the checkout.
    location = /data/metadata.json {
        alias /srv/jobboard/current/metadata.json;
        default_type application/json;
        expires -1;
    }

    location = /data/trends/daily.jsonl {
        default_type application/x-ndjson;
        expires 5m;
    }

    # The HTML document. Must keep the inherited CSP, hence `expires`.
    location = / {
        expires -1;
    }

    location ~* \.(js|css)$ {
        expires 1h;
    }

    # Nothing else in the checkout should be reachable.
    location /scripts/ { deny all; }
    location /deploy/  { deny all; }
    location /data/    { deny all; }
    location ~ /\.     { deny all; }
}
